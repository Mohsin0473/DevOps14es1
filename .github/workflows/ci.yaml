name: wf-dev-lint
on:
  pull_request:
    branches:
      - develop
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: action/checkout@v4
      - name: lint html and css
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"   
  bulid-job:
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: action/checkout@v4
      - name: build with parcel
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev"
          --public-url "./"
